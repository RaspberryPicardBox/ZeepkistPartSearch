name: Dependency review

# Comments on a pull request when it adds or changes a dependency with a known
# vulnerability, and fails the check so the merge is blocked.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
